name: Reelmint CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Syntax-check all JS
        run: |
          for f in server/*.js public/app.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Run tests
        run: npm test

      # Reported, not gated. The app runs in-process in tests so this actually
      # covers server/index.js, billing.js and ai.js — a spawned server would be
      # invisible to the instrumentation and silently report 0%.
      - name: Coverage report
        run: npm run test:coverage

      - name: Smoke-test server (demo mode)
        run: |
          PORT=3000 node server/index.js &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "health OK"; break
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS -X POST http://localhost:3000/api/auth/signup \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"secret123"}' > /dev/null && echo "signup OK"
          kill $SRV 2>/dev/null || true
